name = "QCryptLean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["QCryptLean"]
testDriver = "QCryptLeanTest"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

[[lean_lib]]
name = "QCryptLean"

# Regression tests and worked examples, mirroring the library layout; built by `lake test`.
[[lean_lib]]
name = "QCryptLeanTest"
globs = ["QCryptLeanTest.+"]
